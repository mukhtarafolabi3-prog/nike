<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nike Sign In</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="images (1).png" alt="Nike">
        <img src="" alt="Jordan">
    </div>

    <h2>Enter your email to join us or sign in.</h2>

    <p class="country">Nigeria <span>Change</span></p>

    <form>
        <input type="email" placeholder="Email*" required>

        <p class="policy">
            By continuing, I agree to Nike's 
            <a href="#">Privacy Policy</a> and 
            <a href="#">Terms of Use</a>.
        </p>

        <button type="submit">Continue</button>
    </form>

</div>

</body>
</html>
